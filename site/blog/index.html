<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog | Red Pen Review</title>
    <meta name="description" content="Practical notes on mental clarity, reflection, and structured thinking." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=20260739" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand logo-brand" href="/" aria-label="Red Pen Review home">
          <img src="/assets/redpen-logo.jpg" alt="Red Pen Review" />
        </a>
        <button class="menu-toggle" type="button" aria-controls="site-menu" aria-expanded="false" data-menu-toggle>
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div id="site-menu" class="header-menu" data-site-menu>
          <nav class="nav-links" aria-label="Primary navigation" data-list="nav.links"></nav>
          <div class="header-actions">
            <div class="language-links" data-language-switch></div>
            <a class="nav-cta" href="/#download" data-text="nav.cta">Get the free guide</a>
          </div>
        </div>
      </header>

      <main>
        <section class="page-hero section">
          <p class="eyebrow" data-text="page.eyebrow"></p>
          <h1 data-text="page.title"></h1>
          <p class="hero-subtitle" data-text="page.body"></p>
        </section>

        <section class="articles section blog-listing">
          <div class="article-explorer" data-blog-explorer>
            <div class="article-search-row">
              <label class="sr-only" for="article-search-en" data-text="blog.searchLabel">Search articles</label>
              <input id="article-search-en" class="article-search" type="search" autocomplete="off" data-blog-search data-placeholder="blog.searchPlaceholder" />
            </div>
            <div class="article-filter-group">
              <p class="article-filter-label" data-text="blog.categoriesLabel"></p>
              <div class="article-category-list" data-blog-categories></div>
            </div>
            <div class="article-word-cloud" data-blog-word-cloud></div>
          </div>
          <p class="loading-text" data-blog-loading data-text="blog.loading">Loading posts…</p>
          <p class="error-text" data-blog-error hidden></p>
          <div class="article-grid" data-blog-grid></div>
        </section>
      </main>

      <footer class="site-footer" data-footer></footer>
    </div>

    <script src="/main.js?v=20260739"></script>
  </body>
</html>
